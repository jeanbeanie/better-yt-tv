services:
  db:
    image: postgres:16
    container_name: better-yt-tv-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: better_yt_tv
    ports:
      - "5432:5432"
    volumes:
      - better_yt_tv_pgdata:/var/lib/postgresql/data

volumes:
  better_yt_tv_pgdata:
